# =============================================================================
# FreeRADIUS — users.conf (Sample User Definitions)
# Author  : Zill E Ali (MTCNA) | zilleali.com
# Version : 1.0
# Tested  : FreeRADIUS 3.x on Ubuntu 22.04 / 24.04
# =============================================================================
# LOCATION : /etc/freeradius/3.0/users
#
# NOTES:
#   - This is a SAMPLE file. Replace with real credentials in production.
#   - For large deployments, use SQL backend (MySQL/PostgreSQL) instead.
#   - Passwords here are plain-text for clarity. Use hashed in production.
#   - Each entry: username + Auth-Type + reply attributes
# =============================================================================


# --- Basic PPPoE User (Cleartext Password) ---
testuser1   Cleartext-Password := "Test@1234"
            Service-Type = Framed-User,
            Framed-Protocol = PPP,
            Framed-IP-Address = 255.255.255.254,
            Framed-IP-Netmask = 255.255.255.255


# --- User with Static IP Assignment ---
static-user Cleartext-Password := "Static@5678"
            Service-Type = Framed-User,
            Framed-Protocol = PPP,
            Framed-IP-Address = 192.168.100.50,
            Framed-IP-Netmask = 255.255.255.255


# --- User with Bandwidth Limits (MikroTik VSA) ---
# Mikrotik-Rate-Limit = "download/upload"
basic-plan  Cleartext-Password := "Basic@Pass1"
            Service-Type = Framed-User,
            Framed-Protocol = PPP,
            Framed-IP-Address = 255.255.255.254,
            Mikrotik-Rate-Limit = "10M/5M"


standard-plan Cleartext-Password := "Standard@Pass1"
            Service-Type = Framed-User,
            Framed-Protocol = PPP,
            Framed-IP-Address = 255.255.255.254,
            Mikrotik-Rate-Limit = "20M/10M"


premium-plan Cleartext-Password := "Premium@Pass1"
            Service-Type = Framed-User,
            Framed-Protocol = PPP,
            Framed-IP-Address = 255.255.255.254,
            Mikrotik-Rate-Limit = "50M/25M"


# --- User with Session Timeout (seconds) ---
# 86400 = 24 hours | 2592000 = 30 days
limited-user Cleartext-Password := "Limited@Pass1"
            Service-Type = Framed-User,
            Framed-Protocol = PPP,
            Framed-IP-Address = 255.255.255.254,
            Mikrotik-Rate-Limit = "5M/2M",
            Session-Timeout = 86400


# --- Disabled / Expired User (reject example) ---
expired-user Cleartext-Password := "OldPass123"
            Auth-Type := Reject,
            Reply-Message = "Account expired. Please contact support."


# --- DEFAULT fallback (optional) ---
# DEFAULT Auth-Type := Reject
#         Reply-Message = "Access Denied"


# =============================================================================
# FOR PRODUCTION — Use SQL Module:
#   1. Enable sql in /etc/freeradius/3.0/mods-enabled/
#   2. Configure database in /etc/freeradius/3.0/mods-available/sql
#   3. Import schema: /etc/freeradius/3.0/mods-config/sql/main/postgresql/
# =============================================================================