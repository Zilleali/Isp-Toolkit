# FreeRADIUS — clients.conf (NAS Client Definitions)
# Author  : Zill E Ali (MTCNA) | zilleali.com
# Version : 1.0
# Tested  : FreeRADIUS 3.x on Ubuntu 22.04 / 24.04
# =============================================================================
# LOCATION : /etc/freeradius/3.0/clients.conf
#
# WHAT IS A CLIENT?
#   A "client" in RADIUS is any NAS (Network Access Server) device that
#   sends authentication requests to this RADIUS server.
#   Examples: MikroTik routers, Cisco switches, WiFi controllers.
#
# NOTES:
#   - "secret" must match what is set on the MikroTik/NAS side
#   - Use strong secrets in production (min 16 chars, mixed)
#   - Restrict to exact IPs wherever possible (not subnets)
# =============================================================================


# --- Localhost (for testing) ---
client localhost {
    ipaddr          = 127.0.0.1
    secret          = testing123
    shortname       = localhost
    nastype         = other
}


# --- MikroTik Router #1 (Main PPPoE Server) ---
client mikrotik-main {
    ipaddr          = 192.168.1.1
    secret          = Str0ng$ecret!MK1
    shortname       = mikrotik-main
    nastype         = other
    nas_type        = other
}


# --- MikroTik Router #2 (Branch Office) ---
client mikrotik-branch {
    ipaddr          = 192.168.2.1
    secret          = Str0ng$ecret!MK2
    shortname       = mikrotik-branch
    nastype         = other
}


# --- MikroTik Hotspot NAS ---
client mikrotik-hotspot {
    ipaddr          = 10.10.0.1
    secret          = H0tspot$ecret!
    shortname       = mikrotik-hotspot
    nastype         = other
}


# --- Allow entire subnet (use only if necessary) ---
