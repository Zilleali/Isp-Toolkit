# =============================================================================
# HOW TO TEST CLIENT AUTH:
#   radtest <username> <password> <radius-server-ip> 0 <secret>
#
#   Example:
#   radtest testuser1 Test@1234 127.0.0.1 0 testing123
#
#   Expected: Access-Accept
# =============================================================================