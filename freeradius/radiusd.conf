# =============================================================================
# FreeRADIUS — radiusd.conf (Base Server Configuration)
# Author  : Zill E Ali (MTCNA) | zilleali.com
# Version : 1.0
# Tested  : FreeRADIUS 3.x on Ubuntu 22.04 / 24.04
# =============================================================================
# LOCATION : /etc/freeradius/3.0/radiusd.conf
#
# This is a simplified, ISP-optimized base config.
# For full reference: man radiusd.conf
#
# After editing, always test before restarting:
#   sudo freeradius -XC
# =============================================================================


# --- General Server Settings ---
prefix          = /usr
exec_prefix     = /usr
sysconfdir      = /etc
localstatedir   = /var
sbindir         = ${exec_prefix}/sbin
logdir          = /var/log/freeradius
raddbdir        = /etc/freeradius/3.0
radacctdir      = ${logdir}/radacct

name            = freeradius
confdir         = ${raddbdir}
modconfdir      = ${confdir}/mods-config
certdir         = ${confdir}/certs
cadir           = ${confdir}/certs

run_dir         = ${localstatedir}/run/${name}
db_dir          = ${raddbdir}
libdir          = /usr/lib/freeradius
pidfile         = ${run_dir}/${name}.pid

correct_escapes = true
max_request_time = 30
cleanup_delay   = 5
max_requests    = 16384

# Listen on all interfaces (restrict in production if needed)
hostname_lookups = no


# --- Logging ---
log {
    destination = files
    colourise   = yes
    file        = ${logdir}/radius.log
    syslog_facility = daemon

    stripped_names  = no
    auth            = yes          # Log authentication requests
    auth_badpass    = yes          # Log bad passwords
    auth_goodpass   = no           # Don't log successful passwords
    msg_denied      = "You are not authorized to use this device"
}


# --- Security Settings ---
security {
    user  = freerad
    group = freerad

    allow_core_dumps = no
    max_attributes   = 200
    reject_delay     = 1           # Delay reject responses (anti-brute-force)
    status_server    = yes
}


# --- Thread Pool (tune based on server load) ---
thread pool {
    start_servers           = 5
    max_servers             = 32
    min_spare_servers       = 3
    max_spare_servers       = 10
    max_requests_per_server = 0
    auto_limit_acct         = no
}


# --- Modules ---
modules {
    $INCLUDE mods-enabled/
}


# --- Instantiate (run at startup) ---
instantiate {
    # exec
    # expr
}


# --- Policy ---
policy {
    $INCLUDE policy.d/
}


# --- Virtual Servers ---
$INCLUDE sites-enabled/


# =============================================================================
# IMPORTANT POST-INSTALL STEPS:
#
# 1. Enable required modules:
#    cd /etc/freeradius/3.0/mods-enabled
#    ln -s ../mods-available/sql sql         (if using SQL backend)
#    ln -s ../mods-available/sqlcounter sqlcounter
#
# 2. Enable default site:
#    cd /etc/freeradius/3.0/sites-enabled
#    (default and inner-tunnel should already be linked)
#
# 3. Test config:
#    sudo freeradius -XC
#
# 4. Run in debug mode first:
#    sudo freeradius -X
#
# 5. Start service:
#    sudo systemctl enable freeradius
#    sudo systemctl start freeradius
#    sudo systemctl status freeradius
# =============================================================================